[project]
name = "flatprice"
version = "0.1.0"
description = "Multi-portal rental deal finder with municipal tax awareness (Ticino)"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.47",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "shapely>=2.0",
    "pydantic>=2.7",
    "httpx>=0.28.1",
]

[project.scripts]
flatprice = "flatprice.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flatprice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
